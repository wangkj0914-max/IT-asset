# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /asset

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/it_asset_manage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:CHNX#000}
  thymeleaf:
    cache: false
  # Flyway 数据库迁移（现有系统默认关闭，新部署使用 --spring.profiles.active=flyway 启用）
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:it-asset-system-default-secret-key}
  # Token 过期时间：8 小时（毫秒）
  expiration: 28800000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.asset.itassetsystem.entity

# 邮件配置（按需修改 SMTP 参数）
# spring:
#   mail:
#     host: smtp.example.com
#     port: 587
#     username: your-email@example.com
#     password: your-password
#     properties:
#       mail.smtp.auth: true
#       mail.smtp.starttls.enable: true

# 合同到期提醒配置
contract:
  remind:
    cron: "0 0 9 * * ?"       # 每天上午9点检查
    days: "30,15,7"             # 到期前30/15/7天提醒
    email: ""                   # 提醒邮件接收人，多个用逗号分隔（为空则不发送）

