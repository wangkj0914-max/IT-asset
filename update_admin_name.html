<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>更新 Admin 姓名</title>
</head>
<body>
    <h1>更新 Admin 用户姓名</h1>
    <button onclick="updateName()">点击更新 admin 姓名为"系统管理员"</button>
    <pre id="result"></pre>
    
    <script>
        async function updateName() {
            try {
                const response = await fetch('http://localhost:8080/asset/user/update-name?userId=1&realName=系统管理员', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                
                if (data.code === 200) {
                    alert('更新成功！刷新页面查看用户列表。');
                } else {
                    alert('更新失败：' + data.msg);
                }
            } catch (error) {
                document.getElementById('result').textContent = '错误：' + error.message;
            }
        }
        
        // 自动执行一次
        updateName();
    </script>
</body>
</html>
