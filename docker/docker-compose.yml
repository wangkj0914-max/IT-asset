version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: asset-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # CMD-SHELL + $$ 运行时展开：口令不出现在 docker inspect / compose config 输出
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: asset-backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: asset-frontend
    restart: always
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend

volumes:
  mysql-data:

# 固定默认网络子网（生产服务器 172.19.4.244 上的既有配置，2026-09-11 补回仓库以消除本地/服务器漂移）
networks:
  default:
    ipam:
      config:
        - subnet: 10.22.0.0/24
